<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evelyn Erlij</title>
<style>
  :root {
    --text: #1a1a1a;
    --muted: #8a8a8a;
    --line: #e8e8e8;
    --bg: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 220px;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
  }
  .sidebar h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-bottom: 40px;
  }
  .sidebar nav { display: flex; flex-direction: column; gap: 6px; }
  .sidebar nav .group-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 20px 0 4px;
  }
  .sidebar nav .group-label:first-child { margin-top: 0; }
  .sidebar nav a {
    color: var(--muted);
    transition: color .15s;
    cursor: pointer;
  }
  .sidebar nav a:hover { color: var(--text); }
  .sidebar nav a.active { color: var(--text); }
  .sidebar .footer {
    margin-top: auto;
    color: var(--muted);
    font-size: 11px;
  }
  .sidebar .footer a:hover { color: var(--text); }

  /* ---------- Main ---------- */
  main {
    margin-left: 220px;
    padding: 48px 48px 96px;
    max-width: 1100px;
  }
  .page { display: none; }
  .page.visible { display: block; }
  .page-title {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    margin-bottom: 32px;
  }
  .page-title strong { color: var(--text); font-weight: 500; }

  /* ---------- Grid de obras ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 40px 28px;
  }
  .work { cursor: pointer; }
  .work img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    background: #f2f1ef;
    transition: opacity .2s;
  }
  .work:hover img { opacity: 0.88; }
  .work .caption { margin-top: 10px; }
  .work .caption .title { color: var(--text); }
  .work .caption .details { color: var(--muted); }
  .empty-note { color: var(--muted); }

  /* ---------- CV ---------- */
  .cv { max-width: 560px; }
  .cv .portrait {
    width: 400px;
    max-width: 100%;
    display: block;
    margin-bottom: 28px;
  }
  .cv h2 {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 36px 0 12px;
  }
  .cv .entry { display: flex; gap: 20px; margin-bottom: 6px; }
  .cv .year { color: var(--muted); flex: 0 0 40px; }
  .cv .bio p { margin-bottom: 14px; }
  .cv .bio p:last-child { margin-bottom: 0; }
  .cv .bio strong { font-weight: 600; }

  /* ---------- Contacto ---------- */
  .contact { max-width: 480px; font-size: 15px; line-height: 1.8; }
  .contact a { border-bottom: 1px solid var(--line); }
  .contact a:hover { border-color: var(--text); }

  /* ---------- Catálogo ---------- */
  .catalogo { max-width: 480px; font-size: 15px; line-height: 1.8; }
  .catalogo-download {
    display: inline-block;
    border: 1px solid var(--line);
    padding: 10px 18px;
    margin-top: 4px;
  }
  .catalogo-download:hover { border-color: var(--text); }

  /* ---------- Lightbox ---------- */
  .lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.97);
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 80vw;
    max-height: 72vh;
    display: block;
    cursor: pointer;
  }
  .lightbox .lb-caption { margin-top: 16px; color: var(--muted); text-align: center; }
  .lightbox .lb-caption .title { color: var(--text); }
  .lightbox .lb-counter { margin-top: 4px; color: var(--muted); font-size: 11px; text-align: center; }
  .lightbox .lb-close {
    position: absolute; top: 24px; right: 32px;
    font-size: 22px; color: var(--muted); cursor: pointer;
    background: none; border: none; font-family: inherit;
  }
  .lightbox .lb-close:hover { color: var(--text); }
  .lightbox .lb-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 26px; color: var(--muted); cursor: pointer;
    background: none; border: none; font-family: inherit;
    padding: 16px;
  }
  .lightbox .lb-arrow:hover { color: var(--text); }
  .lightbox .lb-prev { left: 16px; }
  .lightbox .lb-next { right: 16px; }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    .sidebar {
      position: static;
      width: auto;
      padding: 32px 24px 8px;
    }
    .sidebar .footer { margin-top: 24px; }
    main { margin-left: 0; padding: 24px; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <h1 id="site-name">Evelyn Erlij</h1>
  <nav>
    <span class="group-label">Colecciones</span>
    <a data-page="ceramica">Cerámica</a>
    <a data-page="latas">Latas</a>
    <a data-page="otras">Otras cosas</a>
    <span class="group-label">Info</span>
    <a data-page="cv">CV</a>
    <a data-page="catalogo">Catálogo</a>
    <a data-page="contacto">Contacto</a>
  </nav>
  <div class="footer">
    <a id="ig-link" href="https://www.instagram.com/lasdiminutas/" target="_blank">Instagram ↗</a><br>
    © 2026 <span id="footer-name">Evelyn Erlij</span>
  </div>
</aside>

<main>

  <!-- Colección: Cerámica -->
  <section class="page" id="ceramica">
    <p class="page-title"><strong>Cerámica</strong></p>
    <div class="grid" id="grid-ceramica"></div>
  </section>

  <!-- Colección: Latas -->
  <section class="page" id="latas">
    <p class="page-title"><strong>Latas</strong></p>
    <div class="grid" id="grid-latas"></div>
  </section>

  <!-- Colección: Otras cosas -->
  <section class="page" id="otras">
    <p class="page-title"><strong>Otras cosas</strong></p>
    <div class="grid" id="grid-otras"></div>
  </section>

  <!-- CV -->
  <section class="page" id="cv">
    <p class="page-title"><strong>CV</strong></p>
    <div class="cv">
      <h2>Bio</h2>
      <div class="bio" id="bio-text"></div>
    </div>
  </section>

  <!-- Catálogo -->
  <section class="page" id="catalogo">
    <p class="page-title"><strong>Catálogo</strong></p>
    <div class="catalogo">
      <p id="catalogo-empty" class="empty-note">Todavía no hay catálogo disponible.</p>
      <a id="catalogo-link" class="catalogo-download" href="" target="_blank" style="display:none;">Descargar catálogo (PDF) ↓</a>
    </div>
  </section>

  <!-- Contacto -->
  <section class="page" id="contacto">
    <p class="page-title"><strong>Contacto</strong></p>
    <div class="contact">
      <p>Para encargos, ventas o consultas:</p>
      <p><a id="contact-email" href="mailto:hola@erlij.art">hola@erlij.art</a><br>
      <a id="contact-ig" href="https://www.instagram.com/lasdiminutas/" target="_blank">Instagram ↗</a></p>
    </div>
  </section>

</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" aria-label="Cerrar">×</button>
  <button class="lb-arrow lb-prev" aria-label="Anterior">←</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-caption"><div class="title" id="lb-title"></div><div id="lb-details"></div></div>
  <div class="lb-counter" id="lb-counter"></div>
  <button class="lb-arrow lb-next" aria-label="Siguiente">→</button>
</div>

<script>
  // ---------- Navegación entre páginas ----------
  document.querySelectorAll('.sidebar nav a[data-page]').forEach(link => {
    link.addEventListener('click', () => {
      document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('visible'));
      document.getElementById(link.dataset.page).classList.add('visible');
      window.scrollTo(0, 0);
    });
  });

  // ---------- Lightbox (delegado, funciona con contenido cargado dinámicamente) ----------
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCounter = document.getElementById('lb-counter');
  let imgs = [], idx = 0;

  function show(i) {
    idx = (i + imgs.length) % imgs.length;
    lbImg.src = imgs[idx];
    lbCounter.textContent = imgs.length > 1 ? (idx + 1) + ' / ' + imgs.length : '';
    lb.querySelector('.lb-prev').style.visibility = imgs.length > 1 ? 'visible' : 'hidden';
    lb.querySelector('.lb-next').style.visibility = imgs.length > 1 ? 'visible' : 'hidden';
  }

  document.addEventListener('click', e => {
    const w = e.target.closest('.work');
    if (!w) return;
    imgs = w.dataset.imgs.split(',');
    document.getElementById('lb-title').textContent = w.dataset.title;
    document.getElementById('lb-details').textContent = w.dataset.details;
    show(0);
    lb.classList.add('open');
  });

  lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
  lb.querySelector('.lb-close').addEventListener('click', () => lb.classList.remove('open'));
  lb.querySelector('.lb-prev').addEventListener('click', () => show(idx - 1));
  lb.querySelector('.lb-next').addEventListener('click', () => show(idx + 1));
  lbImg.addEventListener('click', () => show(idx + 1));
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') show(idx - 1);
    if (e.key === 'ArrowRight') show(idx + 1);
  });

  // ---------- Carga de contenido desde /content ----------
  function escapeHtml(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Convierte un texto simple con **negrita**, *cursiva*, [link](url) y
  // párrafos separados por línea en blanco, a HTML seguro.
  function mdToHtml(md) {
    let text = escapeHtml(md || '');
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    text = text.replace(/_([^_\n]+)_/g, '<em>$1</em>');
    const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    if (!paragraphs.length) return '';
    return paragraphs.map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  }

  function detailsOf(obra) {
    return [obra.materiales, obra.medidas, obra.año].filter(Boolean).join(', ');
  }

  function workHtml(obra) {
    const title = escapeHtml(obra.titulo);
    const det = escapeHtml(detailsOf(obra));
    const imgsList = (obra.imagenes || []).join(',');
    const cover = (obra.imagenes && obra.imagenes[0]) || '';
    return `<div class="work" data-title="${title}" data-details="${det}" data-imgs="${escapeHtml(imgsList)}">
      <img src="${cover}" alt="${title}" loading="lazy">
      <div class="caption"><div class="title">${title}</div><div class="details">${det}</div></div>
    </div>`;
  }

  fetch('content/obras.json')
    .then(r => r.json())
    .then(data => {
      const obras = data.obras || [];
      const byColeccion = { ceramica: [], latas: [], otras: [] };
      obras.forEach(o => { if (byColeccion[o.coleccion]) byColeccion[o.coleccion].push(o); });
      Object.keys(byColeccion).forEach(col => {
        const el = document.getElementById('grid-' + col);
        if (!byColeccion[col].length) {
          el.innerHTML = '<p class="empty-note">Todavía no hay obras acá.</p>';
        } else {
          el.innerHTML = byColeccion[col].map(workHtml).join('');
        }
      });
    })
    .catch(() => {
      document.querySelectorAll('.grid').forEach(el => {
        el.innerHTML = '<p class="empty-note">No se pudo cargar el contenido.</p>';
      });
    });

  fetch('content/pagina.json')
    .then(r => r.json())
    .then(p => {
      if (p.nombre) {
        document.getElementById('site-name').textContent = p.nombre;
        document.getElementById('footer-name').textContent = p.nombre;
        document.title = p.nombre;
      }
      if (p.bio) document.getElementById('bio-text').innerHTML = mdToHtml(p.bio);
      if (p.email_contacto) {
        const a = document.getElementById('contact-email');
        a.textContent = p.email_contacto;
        a.href = 'mailto:' + p.email_contacto;
      }
      if (p.instagram) {
        document.getElementById('ig-link').href = p.instagram;
        document.getElementById('contact-ig').href = p.instagram;
      }
      if (p.catalogo_pdf) {
        const link = document.getElementById('catalogo-link');
        link.href = p.catalogo_pdf;
        link.style.display = 'inline-block';
        document.getElementById('catalogo-empty').style.display = 'none';
      }
    })
    .catch(() => {});
</script>

</body>
</html>
